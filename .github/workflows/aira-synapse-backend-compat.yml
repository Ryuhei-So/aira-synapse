name: aira-synapse-backend-compat

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/memgraphrag/**'
      - '.github/workflows/aira-synapse-backend-compat.yml'
      - '.github/workflows/memgraphrag-ci.yml'
  merge_group:
  push:
    branches: [main, production-runtime, 'production-runtime/**']
    paths:
      - 'packages/memgraphrag/**'
      - '.github/workflows/aira-synapse-backend-compat.yml'
      - '.github/workflows/memgraphrag-ci.yml'

jobs:
  storage-port-contract:
    runs-on: ubuntu-latest
    env:
      AIRA_GRAPHDB_REPO_PATH: ${{ github.workspace }}/aira-graphdb
      AIRA_GRAPHDB_EXPECTED_SHA: 164092aa47f39330c0c771495d9d42e4e935e41b
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Ryuhei-So/aira-graphdb
          ref: 164092aa47f39330c0c771495d9d42e4e935e41b
          path: aira-graphdb
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm test -- --config vitest.contract.config.ts
        working-directory: packages/memgraphrag

  storage-port-compat:
    runs-on: ubuntu-latest
    needs: storage-port-contract
    env:
      AIRA_GRAPHDB_REPO_PATH: ${{ github.workspace }}/aira-graphdb
      AIRA_GRAPHDB_EXPECTED_SHA: 164092aa47f39330c0c771495d9d42e4e935e41b
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Ryuhei-So/aira-graphdb
          ref: 164092aa47f39330c0c771495d9d42e4e935e41b
          path: aira-graphdb
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm test -- --fileParallelism=false tests/integration/storage-port-compat/aira_graphdb.storage-port-compat.test.ts
        working-directory: packages/memgraphrag

  backend-compat:
    runs-on: ubuntu-latest
    needs: storage-port-compat
    env:
      AIRA_GRAPHDB_REPO_PATH: ${{ github.workspace }}/aira-graphdb
      AIRA_GRAPHDB_EXPECTED_SHA: 164092aa47f39330c0c771495d9d42e4e935e41b
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Ryuhei-So/aira-graphdb
          ref: 164092aa47f39330c0c771495d9d42e4e935e41b
          path: aira-graphdb
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Run backend compatibility tests
        id: backend_compat_tests
        run: |
          set +e
          (cd packages/memgraphrag && npm test -- --fileParallelism=false tests/integration/backend-compat/vector_lexical_compat.integration.test.ts)
          status=$?
          if [ "$status" -eq 0 ]; then
            node packages/memgraphrag/scripts/backend-compat-report.mjs \
              --status pass \
              --backend aira-graphdb \
              --out artifacts/backend-compat-report-untrusted.json
          else
            node packages/memgraphrag/scripts/backend-compat-report.mjs \
              --status fail \
              --backend aira-graphdb \
              --errorCode INVALID_ARGUMENT \
              --failedTests backend-compat:routing-and-fallback \
              --out artifacts/backend-compat-report-untrusted.json
          fi
          exit "$status"
      - uses: actions/upload-artifact@v4
        with:
          name: backend-compat-untrusted
          path: artifacts/backend-compat-report-untrusted.json

  backend-compat-strict:
    runs-on: ubuntu-latest
    needs: backend-compat
    if: github.event_name == 'merge_group'
    env:
      AIRA_GRAPHDB_REPO_PATH: ${{ github.workspace }}/aira-graphdb
      AIRA_GRAPHDB_EXPECTED_SHA: 164092aa47f39330c0c771495d9d42e4e935e41b
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Ryuhei-So/aira-graphdb
          ref: 164092aa47f39330c0c771495d9d42e4e935e41b
          path: aira-graphdb
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Validate strict token gate
        env:
          AIRA_GRAPHDB_CONTRACTS_READ_TOKEN: ${{ secrets.AIRA_GRAPHDB_CONTRACTS_READ_TOKEN }}
        run: |
          if [ -z "$AIRA_GRAPHDB_CONTRACTS_READ_TOKEN" ]; then
            echo "permission_missing:contracts_read"
            exit 1
          fi
      - name: Run strict backend compatibility tests
        run: |
          (cd packages/memgraphrag && npm test -- --fileParallelism=false tests/integration/backend-compat/vector_lexical_compat.integration.test.ts)
          node packages/memgraphrag/scripts/backend-compat-report.mjs \
            --status pass \
            --backend aira-graphdb \
            --out artifacts/backend-compat-report-strict.json
      - uses: actions/upload-artifact@v4
        with:
          name: backend-compat-strict
          path: artifacts/backend-compat-report-strict.json

  branch-protection-audit:
    runs-on: ubuntu-latest
    needs: backend-compat
    env:
      AIRA_GRAPHDB_REPO_PATH: ${{ github.workspace }}/aira-graphdb
      AIRA_GRAPHDB_EXPECTED_SHA: 164092aa47f39330c0c771495d9d42e4e935e41b
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Ryuhei-So/aira-graphdb
          ref: 164092aa47f39330c0c771495d9d42e4e935e41b
          path: aira-graphdb
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Run branch protection audit (untrusted/read-only mode)
        run: node packages/memgraphrag/scripts/branch-protection-audit.mjs --mode untrusted
      - uses: actions/upload-artifact@v4
        with:
          name: branch-protection-audit-untrusted
          path: artifacts/branch-protection-audit-untrusted.json

  branch-protection-audit-strict:
    runs-on: ubuntu-latest
    needs: backend-compat-strict
    if: github.event_name == 'merge_group'
    env:
      AIRA_GRAPHDB_REPO_PATH: ${{ github.workspace }}/aira-graphdb
      AIRA_GRAPHDB_EXPECTED_SHA: 164092aa47f39330c0c771495d9d42e4e935e41b
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Ryuhei-So/aira-graphdb
          ref: 164092aa47f39330c0c771495d9d42e4e935e41b
          path: aira-graphdb
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Run branch protection audit (trusted strict mode)
        env:
          AIRA_SYNAPSE_ADMIN_TOKEN: ${{ secrets.AIRA_SYNAPSE_ADMIN_TOKEN }}
        run: node packages/memgraphrag/scripts/branch-protection-audit.mjs --mode strict
      - uses: actions/upload-artifact@v4
        with:
          name: branch-protection-audit-strict
          path: artifacts/branch-protection-audit-strict.json
