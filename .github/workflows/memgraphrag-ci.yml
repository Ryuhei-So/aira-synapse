name: MemGraphRAG CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/memgraphrag/**'
      - 'spec/PLAN-MEMGRAPHRAG-001.md'
      - '.github/workflows/aira-synapse-backend-compat.yml'
      - '.github/workflows/memgraphrag-ci.yml'
  push:
    branches: [main, 'production-runtime/**']
    paths:
      - 'packages/memgraphrag/**'
      - '.github/workflows/aira-synapse-backend-compat.yml'
      - '.github/workflows/memgraphrag-ci.yml'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint --workspace=packages/memgraphrag

  test:
    runs-on: ubuntu-latest
    env:
      AIRA_GRAPHDB_REPO_PATH: ${{ github.workspace }}/aira-graphdb
      AIRA_GRAPHDB_EXPECTED_SHA: 164092aa47f39330c0c771495d9d42e4e935e41b
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Ryuhei-So/aira-graphdb
          ref: 164092aa47f39330c0c771495d9d42e4e935e41b
          path: aira-graphdb
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run test --workspace=packages/memgraphrag

  coverage:
    runs-on: ubuntu-latest
    needs: test
    env:
      AIRA_GRAPHDB_REPO_PATH: ${{ github.workspace }}/aira-graphdb
      AIRA_GRAPHDB_EXPECTED_SHA: 164092aa47f39330c0c771495d9d42e4e935e41b
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Ryuhei-So/aira-graphdb
          ref: 164092aa47f39330c0c771495d9d42e4e935e41b
          path: aira-graphdb
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run test:coverage --workspace=packages/memgraphrag

  build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build --workspace=packages/memgraphrag
