name: MemGraphRAG CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/memgraphrag/**'
      - 'packages/memgraphrag/package.json'
      - 'packages/memgraphrag/scripts/production-runtime-anchor.mjs'
      - 'packages/memgraphrag/tests/unit/scripts/production-runtime-anchor.test.ts'
      - '.github/anchors/**'
      - 'spec/PLAN-MEMGRAPHRAG-001.md'
      - '.github/workflows/aira-synapse-backend-compat.yml'
      - '.github/workflows/memgraphrag-ci.yml'
  push:
    branches: [main, production-runtime, 'production-runtime/**']
    paths:
      - 'packages/memgraphrag/**'
      - '.github/workflows/aira-synapse-backend-compat.yml'
      - '.github/workflows/memgraphrag-ci.yml'
      - '.github/anchors/**'

jobs:
  unicode16-conformance:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - run: npm run check:unicode16-lowercase --workspace=packages/memgraphrag
      - run: npm test --workspace=packages/memgraphrag -- tests/unit/domain/text/unicode16Lowercase.test.ts tests/unit/scripts/unicode16LowercaseGenerator.test.ts

  unicode16-oracle:
    runs-on: ubuntu-latest
    env:
      UNICODE16_AMBIENT_ORACLE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
          cache: 'npm'
      - run: npm ci
      - run: npm run check:unicode16-lowercase --workspace=packages/memgraphrag
      - run: npm test --workspace=packages/memgraphrag -- tests/unit/domain/text/unicode16Lowercase.test.ts tests/unit/scripts/unicode16LowercaseGenerator.test.ts

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint --workspace=packages/memgraphrag

  test:
    runs-on: ubuntu-latest
    env:
      AIRA_GRAPHDB_REPO_PATH: ${{ github.workspace }}/aira-graphdb
      AIRA_GRAPHDB_EXPECTED_SHA: a5e25c008a704363a323782fa6571f07a47f9975
      AIRA_GRAPHDB_NATIVE_CMD: node ${{ github.workspace }}/packages/memgraphrag/scripts/native-transaction-owner.test-fixture.mjs ${{ github.workspace }}/aira-graphdb/target/release/aira-graphdb-native
    steps:
      # The anchor verifier checks the reviewed 8414946 Git object. Keep full history;
      # a shallow checkout must fail closed when that exact object is unavailable.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: Ryuhei-So/aira-graphdb
          ref: a5e25c008a704363a323782fa6571f07a47f9975
          path: aira-graphdb
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --locked --release --bin aira-graphdb-native --manifest-path "$AIRA_GRAPHDB_REPO_PATH/Cargo.toml"
      - run: npm ci
      - run: npm run test:ci --workspace=packages/memgraphrag

  coverage:
    runs-on: ubuntu-latest
    needs: test
    env:
      AIRA_GRAPHDB_REPO_PATH: ${{ github.workspace }}/aira-graphdb
      AIRA_GRAPHDB_EXPECTED_SHA: a5e25c008a704363a323782fa6571f07a47f9975
      AIRA_GRAPHDB_NATIVE_CMD: node ${{ github.workspace }}/packages/memgraphrag/scripts/native-transaction-owner.test-fixture.mjs ${{ github.workspace }}/aira-graphdb/target/release/aira-graphdb-native
    steps:
      # Coverage runs the same full test set, including the immutable anchor verifier.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: Ryuhei-So/aira-graphdb
          ref: a5e25c008a704363a323782fa6571f07a47f9975
          path: aira-graphdb
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --locked --release --bin aira-graphdb-native --manifest-path "$AIRA_GRAPHDB_REPO_PATH/Cargo.toml"
      - run: npm ci
      - run: npm run test:coverage:ci --workspace=packages/memgraphrag

  build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build --workspace=packages/memgraphrag
      - run: npm run check:bounded-domain-fixture --workspace=packages/memgraphrag
      - run: npm run check:bounded-retrieval-artifact --workspace=packages/memgraphrag
