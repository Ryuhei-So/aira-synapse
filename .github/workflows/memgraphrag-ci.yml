name: MemGraphRAG CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/memgraphrag/**'
      - 'spec/PLAN-MEMGRAPHRAG-001.md'
      - '.github/workflows/memgraphrag-ci.yml'
      - '.github/workflows/aira-synapse-backend-compat.yml'
      - '.github/memgraphrag-coverage-baseline.json'
      - '.github/memgraphrag-lint-baseline.json'
  push:
    branches: [main, 'production-runtime/**']
    paths:
      - 'packages/memgraphrag/**'
      - '.github/workflows/memgraphrag-ci.yml'
      - '.github/workflows/aira-synapse-backend-compat.yml'
      - '.github/memgraphrag-coverage-baseline.json'
      - '.github/memgraphrag-lint-baseline.json'

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Run full lint against the checked-in ratchet
        working-directory: packages/memgraphrag
        run: |
          npx eslint src tests --format json > "$RUNNER_TEMP/memgraphrag-lint.json" || true
          node scripts/lint-ratchet.mjs verify "$RUNNER_TEMP/memgraphrag-lint.json" ../../.github/memgraphrag-lint-baseline.json "$BASE_SHA"

  test:
    runs-on: ubuntu-latest
    env:
      AIRA_GRAPHDB_REPO_PATH: ${{ github.workspace }}/aira-graphdb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: Ryuhei-So/aira-graphdb
          ref: c2413c1d9dd7903caad19c0b3007f8d6c0b76655
          path: aira-graphdb
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Run resource-heavy native/Ladybug suites in fresh processes
        working-directory: packages/memgraphrag
        env:
          AIRA_GRAPHDB_REPO_PATH: ${{ github.workspace }}/aira-graphdb
        run: |
          npm test -- --fileParallelism=false tests/infrastructure/storage/ladybug/LadybugConnection.test.ts
          npm test -- --config vitest.aira-graphdb.config.ts --fileParallelism=false tests/integration/interface/runtime/MemGraphRagRuntime.test.ts
      - run: npm test -- --fileParallelism=false --exclude tests/unit/infrastructure/config/resolveConfigFromEnv.test.ts --exclude tests/infrastructure/storage/ladybug/LadybugConnection.test.ts --exclude tests/integration/interface/runtime/MemGraphRagRuntime.test.ts
        working-directory: packages/memgraphrag
      - name: Run config path test with a deterministic fixture
        working-directory: packages/memgraphrag
        run: |
          printf 'ci-test-key\n' > config/openai_api_key
          trap 'rm -f config/openai_api_key' EXIT
          npm test -- --fileParallelism=false tests/unit/infrastructure/config/resolveConfigFromEnv.test.ts

  coverage:
    runs-on: ubuntu-latest
    needs: test
    env:
      AIRA_GRAPHDB_REPO_PATH: ${{ github.workspace }}/aira-graphdb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: Ryuhei-So/aira-graphdb
          ref: c2413c1d9dd7903caad19c0b3007f8d6c0b76655
          path: aira-graphdb
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Prepare config fixture for full coverage scope
        working-directory: packages/memgraphrag
        run: |
          printf 'ci-test-key\n' > config/openai_api_key
          trap 'rm -f config/openai_api_key' EXIT
          npm run test:coverage -- --config vitest.coverage.config.ts --fileParallelism=false
      - name: Verify coverage ratchet
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/coverage-ratchet.mjs verify coverage/coverage-summary.json ../../.github/memgraphrag-coverage-baseline.json --base-sha "$BASE_SHA"
        working-directory: packages/memgraphrag

  build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build --workspace=packages/memgraphrag
