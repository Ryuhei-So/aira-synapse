version: '3.8'

services:
  neo4j:
    image: neo4j:5.26-community
    container_name: memgraphrag-neo4j
    ports:
      # Bind to localhost only — this is a local dev stack, not for network exposure.
      - "127.0.0.1:7474:7474"   # HTTP (Browser)
      - "127.0.0.1:7687:7687"   # Bolt
    environment:
      # Dev default; override via NEO4J_PASSWORD for anything shared.
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-memgraphrag}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  neo4j_data:
  neo4j_logs:
